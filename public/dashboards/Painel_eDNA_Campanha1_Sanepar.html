<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel eDNA — Campanha 1 Sanepar | Análise integrada por ponto/SIA | ATGC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
 --bg:#070f16; --bg2:#0a1620; --surface:#0e1d2b; --surface2:#122538;
 --line:#1c3447; --line2:#26465e; --txt:#e7f1f7; --txt2:#9fb6c6; --txt3:#6d8597;
 --teal:#11b3c0; --teal-d:#008e9c; --blue:#2b8fd6; --green-atgc:#00ba00;
 --q0:#1faa54; --q1:#9cc02a; --q2:#e0a52e; --q3:#c44d8f; --q4:#7b1fa2;
 --shadow:0 18px 50px -20px rgba(0,0,0,.8);
 --mono:'IBM Plex Mono',monospace; --sans:'IBM Plex Sans',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:radial-gradient(1200px 600px at 80% -10%,#0c2030,transparent),var(--bg);
 color:var(--txt);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--teal)}
h1,h2,h3,h4{font-weight:600;margin:0}
.wrap{max-width:1500px;margin:0 auto;padding:0 22px 80px}
/* Header */
header{position:sticky;top:0;z-index:50;background:linear-gradient(180deg,rgba(7,15,22,.97),rgba(7,15,22,.82));
 backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hd{max-width:1500px;margin:0 auto;padding:14px 22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{font-family:var(--mono);font-weight:600;letter-spacing:.5px}
.brand .a{color:var(--green-atgc)} .brand .t{color:var(--teal)}
.hd h1{font-size:15px;font-weight:600;line-height:1.25}
.hd .sub{color:var(--txt3);font-size:11.5px;font-family:var(--mono)}
.badge{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--txt2);
 border:1px solid var(--line2);border-radius:20px;padding:5px 12px;background:var(--surface)}
/* Tabs */
nav.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);
 max-width:1500px;margin:0 auto;padding:0 14px;background:var(--bg)}
nav.tabs button{background:none;border:none;color:var(--txt3);font-family:var(--sans);
 font-size:12.5px;font-weight:500;padding:12px 14px;cursor:pointer;white-space:nowrap;
 border-bottom:2px solid transparent;transition:.15s}
nav.tabs button:hover{color:var(--txt)}
nav.tabs button.active{color:var(--teal);border-bottom-color:var(--teal)}
nav.tabs .n{font-family:var(--mono);font-size:10px;color:var(--txt3);margin-right:6px}
/* Sections */
section{display:none;padding-top:26px}
section.active{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.sec-h{margin-bottom:6px;font-size:19px}
.sec-d{color:var(--txt2);font-size:13px;margin-bottom:20px;max-width:980px}
/* KPI cards */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:24px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:15px 16px;box-shadow:var(--shadow)}
.kpi .v{font-family:var(--mono);font-size:26px;font-weight:600;color:var(--teal);line-height:1}
.kpi .l{color:var(--txt2);font-size:11.5px;margin-top:7px}
.kpi.sm .v{font-size:21px}
.kpi.alto .v{color:var(--q3)} .kpi.mod .v{color:var(--q2)}
.kpi.bm .v{color:var(--q1)} .kpi.baixo .v{color:var(--q0)}
/* Panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:18px;box-shadow:var(--shadow)}
.panel h3{font-size:14px;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:18px}
@media(max-width:980px){.grid2{grid-template-columns:1fr}}
/* Risk pills */
.pill{display:inline-block;font-family:var(--mono);font-size:10.5px;font-weight:600;
 padding:3px 9px;border-radius:20px;white-space:nowrap}
.r-Baixo{background:rgba(31,170,84,.15);color:#5fd98a;border:1px solid rgba(31,170,84,.4)}
.r-Baixoamoderado{background:rgba(156,192,42,.15);color:#c4e05a;border:1px solid rgba(156,192,42,.4)}
.r-Moderado{background:rgba(224,165,46,.15);color:#f0c060;border:1px solid rgba(224,165,46,.4)}
.r-Alto{background:rgba(196,77,143,.18);color:#e87fb8;border:1px solid rgba(196,77,143,.5)}
.r-Critico{background:rgba(123,31,162,.2);color:#c285e0;border:1px solid rgba(123,31,162,.5)}
/* Distribution bars */
.distbar{display:flex;align-items:center;gap:12px;margin:9px 0}
.distbar .lab{width:140px;font-size:12px;color:var(--txt2)}
.distbar .track{flex:1;height:22px;background:var(--bg2);border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.distbar .fill{height:100%;border-radius:5px;display:flex;align-items:center;justify-content:flex-end;padding-right:8px;
 font-family:var(--mono);font-size:11px;font-weight:600;color:#04121a;min-width:28px}
/* Top list */
.toplist{list-style:none;margin:0;padding:0}
.toplist li{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.toplist li:last-child{border-bottom:none}
.toplist .rk{font-family:var(--mono);font-size:18px;font-weight:600;color:var(--teal);width:30px;text-align:center}
.toplist .info{flex:1}
.toplist .info .nm{font-weight:600;font-size:13px}
.toplist .info .mu{color:var(--txt3);font-size:11.5px;font-family:var(--mono)}
.toplist .sc{font-family:var(--mono);font-size:13px;color:var(--txt2)}
/* Filters */
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:14px}
.fgrp{display:flex;flex-direction:column;gap:4px}
.fgrp label{font-size:10.5px;color:var(--txt3);font-family:var(--mono);text-transform:uppercase;letter-spacing:.5px}
select,input[type=text]{background:var(--bg2);color:var(--txt);border:1px solid var(--line2);
 border-radius:7px;padding:7px 10px;font-family:var(--sans);font-size:12.5px;min-width:150px}
select:focus,input:focus{outline:none;border-color:var(--teal)}
.chk{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--txt2);cursor:pointer;padding:7px 0}
.chk input{accent-color:var(--teal)}
.sortbtns{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.sortbtns button,.btn{background:var(--surface2);color:var(--txt2);border:1px solid var(--line2);
 border-radius:7px;padding:6px 12px;font-family:var(--mono);font-size:11px;cursor:pointer;transition:.15s}
.sortbtns button:hover,.btn:hover{border-color:var(--teal);color:var(--txt)}
.sortbtns button.active{background:var(--teal);color:#04121a;border-color:var(--teal);font-weight:600}
.count{color:var(--txt3);font-size:11.5px;font-family:var(--mono);margin-left:auto}
/* Tables */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
thead th{background:var(--surface2);color:var(--txt2);text-align:left;padding:10px 11px;
 font-weight:600;font-size:11px;position:sticky;top:0;white-space:nowrap;border-bottom:1px solid var(--line2);cursor:pointer}
thead th .ar{color:var(--teal);font-size:9px;margin-left:3px}
tbody td{padding:9px 11px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:hover{background:var(--surface2)}
tbody tr:last-child td{border-bottom:none}
.mono{font-family:var(--mono)}
.num{font-family:var(--mono);text-align:right;white-space:nowrap}
.tax{font-style:italic}
.muted{color:var(--txt3)}
.nowrap{white-space:nowrap}
.detailrow td{background:var(--bg2);padding:14px 16px}
.detailrow .dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.detailrow .dl div{font-size:12px}
.detailrow .dl b{color:var(--txt2);display:block;font-size:10.5px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px}
.expand{cursor:pointer;color:var(--teal);font-family:var(--mono);font-size:11px;user-select:none}
.linkbtn{background:none;border:1px solid var(--line2);color:var(--teal);border-radius:6px;
 padding:3px 8px;font-size:10.5px;font-family:var(--mono);cursor:pointer}
.linkbtn:hover{border-color:var(--teal);background:rgba(17,179,192,.1)}
/* Notes */
.note{background:rgba(17,179,192,.07);border-left:3px solid var(--teal);border-radius:0 8px 8px 0;
 padding:12px 16px;margin:14px 0;font-size:12.5px;color:var(--txt2)}
.note b{color:var(--txt)}
.note.warn{background:rgba(224,165,46,.08);border-left-color:var(--q2)}
.legend{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:11.5px;color:var(--txt2);margin:6px 0 16px}
.legend .it{display:flex;align-items:center;gap:6px}
.legend .sw{width:13px;height:13px;border-radius:3px}
/* Cards (municipios) */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow)}
.mcard .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:10px}
.mcard .nm{font-size:15px;font-weight:600}
.mcard .meta{font-family:var(--mono);font-size:11px;color:var(--txt3);margin-bottom:8px}
.mcard .row{font-size:12px;margin:5px 0;color:var(--txt2)}
.mcard .row b{color:var(--txt)}
.mcard .tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.tag{font-family:var(--mono);font-size:9.5px;padding:2px 7px;border-radius:5px;border:1px solid var(--line2);color:var(--txt2)}
.tag.on{border-color:var(--teal);color:var(--teal)}
/* Ficha */
.ficha{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:980px){.ficha{grid-template-columns:1fr}}
.fblock{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:var(--shadow)}
.fblock h4{font-size:12px;color:var(--teal);font-family:var(--mono);text-transform:uppercase;letter-spacing:.6px;margin-bottom:12px}
.fblock .fr{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.fblock .fr:last-child{border-bottom:none}
.fblock .fr .k{color:var(--txt3)} .fblock .fr .v{text-align:right;font-weight:500}
.fhead{grid-column:1/-1;background:linear-gradient(135deg,var(--surface2),var(--surface));
 border:1px solid var(--line2);border-radius:12px;padding:20px 22px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.fhead .ttl{font-size:21px;font-weight:600} .fhead .mu{color:var(--txt2);font-family:var(--mono);font-size:12.5px;margin-top:3px}
.fhead .sc{text-align:right} .fhead .sc .n{font-family:var(--mono);font-size:30px;font-weight:600;color:var(--teal)}
.fhead .sc .ll{font-size:10.5px;color:var(--txt3);font-family:var(--mono)}
.fnarr{grid-column:1/-1}
/* Heatmap */
.heatwrap{overflow:auto;border:1px solid var(--line);border-radius:10px;max-height:620px}
table.heat{border-collapse:separate;border-spacing:0;font-size:11px}
table.heat th.cor{background:var(--surface2);height:128px;white-space:nowrap;padding:0;vertical-align:bottom;position:sticky;top:0;z-index:3}
table.heat th.cor div{transform:rotate(-55deg);transform-origin:left bottom;width:24px;margin-left:18px;
 font-style:italic;font-weight:500;color:var(--txt2);font-size:10.5px}
table.heat th.rowh{position:sticky;left:0;background:var(--surface);text-align:left;padding:5px 9px;
 z-index:2;border-bottom:1px solid var(--line);border-right:1px solid var(--line2);min-width:200px;max-width:240px}
table.heat th.corner{position:sticky;left:0;top:0;z-index:4;background:var(--surface2)}
table.heat td{width:42px;height:30px;text-align:center;font-family:var(--mono);font-size:9.5px;
 border-bottom:1px solid var(--bg);border-right:1px solid var(--bg);color:#04121a;font-weight:600}
table.heat td.empty{background:var(--bg2);color:transparent}
.rowh .pn{font-size:11.5px;font-weight:500;color:var(--txt)} .rowh .pm{font-size:10px;color:var(--txt3);font-family:var(--mono)}
/* Alerts */
.alert{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:12px;
 border-left:4px solid var(--q3);box-shadow:var(--shadow)}
.alert .ah{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.alert .prio{font-family:var(--mono);font-size:11px;font-weight:600;background:var(--q3);color:#04121a;border-radius:6px;padding:3px 9px}
.alert .ttl{font-size:14px;font-weight:600}
.alert .pt{font-family:var(--mono);font-size:11.5px;color:var(--teal)}
.alert .body{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin-top:6px}
.alert .body div b{display:block;font-size:10px;font-family:var(--mono);text-transform:uppercase;color:var(--txt3);letter-spacing:.4px;margin-bottom:2px}
.alert .body div{font-size:12px;color:var(--txt2)}
.urg-Alta{border-left-color:var(--q3)} .urg-Média,.urg-Media{border-left-color:var(--q2)} .urg-Baixa{border-left-color:var(--q1)}
.reccol{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:980px){.reccol{grid-template-columns:1fr}}
.recbox{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.recbox h4{font-size:12.5px;color:var(--teal);margin-bottom:10px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.5px}
.recbox .ri{padding:9px 0;border-bottom:1px solid var(--line);font-size:12px}
.recbox .ri:last-child{border-bottom:none}
.recbox .ri b{display:block;color:var(--txt);margin-bottom:2px}
.recbox .ri span{color:var(--txt3);font-size:11px}
footer{margin-top:40px;padding-top:20px;border-top:1px solid var(--line);color:var(--txt3);font-size:11px;font-family:var(--mono)}
.logo-img-proj{height:50px;width:auto;display:block;border-radius:8px}
.logo-divider{width:1px;height:38px;background:var(--line2)}
.logo-img-atgc{height:56px;width:auto;display:block;margin-bottom:10px}
.logo-proj{font-family:var(--mono);font-size:10.5px;font-weight:600;color:var(--txt3);
 border:1px dashed var(--line2);border-radius:8px;padding:10px 14px;letter-spacing:.5px;background:var(--surface);min-width:120px;text-align:center}
.logo-atgc{font-family:var(--mono);font-size:10.5px;font-weight:600;color:var(--txt3);
 border:1px dashed var(--line2);border-radius:8px;padding:8px 12px;letter-spacing:.5px;display:inline-block;margin-top:10px}
.bars{display:flex;flex-direction:column;gap:6px}
.barrow{display:flex;align-items:center;gap:10px;font-size:12px}
.barrow .bl{width:230px;color:var(--txt2);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barrow .bt{flex:1;height:18px;background:var(--bg2);border-radius:5px;overflow:hidden;border:1px solid var(--line)}
.barrow .bf{height:100%;background:linear-gradient(90deg,var(--teal-d),var(--teal));border-radius:4px}
.barrow .bv{font-family:var(--mono);font-size:11px;color:var(--txt2);width:90px;white-space:nowrap}
.barrow.biv .bf{background:linear-gradient(90deg,#8a5a2b,#e0a52e)}
.subnote{font-size:11px;color:var(--txt3);margin:8px 0 0}
.hide{display:none!important}
</style>
</head>

<script>"use strict";

const QC = {0:'#1faa54',1:'#9cc02a',2:'#e0a52e',3:'#c44d8f',4:'#7b1fa2'};
const esc = s => (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = n => (n==null||n==='')?'—':Number(n).toLocaleString('pt-BR');
const fpc = n => (n==null||n===''||isNaN(n))?'—':Number(n).toLocaleString('pt-BR',{maximumFractionDigits:1})+'%';
const f3  = n => (n==null||n==='')?'—':Number(n).toLocaleString('pt-BR',{minimumFractionDigits:3,maximumFractionDigits:3});
const cls = c => 'r-'+String(c||'').replace(/[^A-Za-zÀ-ú]/g,'');
const pill = c => `<span class="pill ${cls(c)}">${esc(c||'—')}</span>`;
const uniq = a => [...new Set(a)].filter(x=>x!=null&&x!=='').sort((x,y)=>String(x).localeCompare(String(y),'pt-BR'));

const TABS = [
 ['panorama','Panorama executivo'],['municipios','Municípios & Captações/SIA'],
 ['ranking','Ranking por ponto/SIA'],['ficha','Ficha técnica do ponto'],
 ['organismos','Organismos prioritários'],['ciano','Cianobactérias'],
 ['bact','Bactérias 16S'],['coi','Eucariotos COI'],
 ['alertas','Alertas e recomendações'],['metodo','Método e limitações']
];
let CUR='panorama';
const navEl=document.getElementById('tabs');
TABS.forEach(([id,label],i)=>{
 const b=document.createElement('button'); b.dataset.id=id;
 b.innerHTML=`<span class="n">${String(i+1).padStart(2,'0')}</span>${label}`;
 b.onclick=()=>go(id); navEl.appendChild(b);
});
function go(id){ CUR=id;
 [...navEl.children].forEach(b=>b.classList.toggle('active',b.dataset.id===id));
 [...app.querySelectorAll('section')].forEach(s=>s.classList.toggle('active',s.id==='sec-'+id));
 window.scrollTo({top:0,behavior:'smooth'});
}
function sec(id){const s=document.createElement('section');s.id='sec-'+id;app.appendChild(s);return s;}

/* ============ helpers ============ */
function shortReco(t){ if(!t)return'—'; return esc(t.length>120?t.slice(0,118)+'…':t); }
function legendRisk(){
 const items=[['Baixo',0],['Baixo a moderado',1],['Moderado',2],['Alto',3],['Crítico (não observado nesta campanha)',4]];
 return `<div class="legend">${items.map(([l,q])=>`<span class="it"><span class="sw" style="background:${QC[q]}"></span>${l}</span>`).join('')}</div>`;
}

/* generic sortable table: cols=[{k,label,cls,render,val}], val for sorting */
function buildTable(rows,cols,state){
 state=state||{sort:null,dir:1};
 const wrap=document.createElement('div'); wrap.className='tablewrap';
 const tbl=document.createElement('table');
 const thead=`<thead><tr>${cols.map((c,i)=>`<th data-i="${i}">${esc(c.label)}<span class="ar">${state.sort===i?(state.dir>0?'▲':'▼'):''}</span></th>`).join('')}</tr></thead>`;
 let data=rows.slice();
 if(state.sort!=null){const c=cols[state.sort];
  data.sort((a,b)=>{let x=c.val?c.val(a):a[c.k],y=c.val?c.val(b):b[c.k];
   if(typeof x==='number'&&typeof y==='number')return (x-y)*state.dir;
   return String(x==null?'':x).localeCompare(String(y==null?'':y),'pt-BR')*state.dir;});
 }
 const body=data.map(r=>`<tr>${cols.map(c=>`<td class="${c.cls||''}">${c.render?c.render(r):esc(r[c.k])}</td>`).join('')}</tr>`).join('');
 tbl.innerHTML=thead+'<tbody>'+body+'</tbody>';
 tbl.querySelectorAll('th').forEach(th=>th.onclick=()=>{const i=+th.dataset.i;
  if(state.sort===i)state.dir*=-1;else{state.sort=i;state.dir=1;}
  const nw=buildTable(rows,cols,state);wrap.replaceWith(nw);});
 wrap.appendChild(tbl); return wrap;
}

(function(){
 const s=sec('panorama');const k=D.kpi;
 const kpis=[['registros','Registros moleculares'],['amostras','Amostras'],

 s.innerHTML=`
 <h2 class="sec-h">Panorama executivo</h2>
 <p class="sec-d">Fotografia molecular da Campanha 1. Todos os indicadores correspondem a triagem molecular relativa por metabarcoding/eDNA. Não representam abundância real, viabilidade, toxicidade, infectividade ou conformidade legal.</p>
 <div class="kpis">${kpis.map(([kk,l])=>`<div class="kpi"><div class="v">${fmt(k[kk])}</div><div class="l">${l}</div></div>`).join('')}</div>

      <div class="mu">${esc(r['Município'])} · ${pill(r['Classificação integrada'])}</div></div>

 </div>
 <div class="panel"><h3>Resumo executivo</h3>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px">
   <div><b class="mono" style="color:var(--teal);font-size:11px">PRINCIPAIS GRUPOS DE RISCO</b>
    <p style="color:var(--txt2);font-size:12.5px;margin:6px 0">Cianobactérias prioritárias (Ciano), bactérias de interesse sanitário/oportunista (Bact 16S) e organismos COI de interesse operacional, com destaque para o bivalve exótico <i>Corbicula fluminea</i>.</p></div>
   <div><b class="mono" style="color:var(--teal);font-size:11px">PONTOS DE MAIOR RISCO</b>
    <p style="color:var(--txt2);font-size:12.5px;margin:6px 0">${D.ranking.slice(0,5).map(r=>esc(r['Ponto de coleta'])+' ('+esc(r['Município'])+')').join('; ')}.</p></div>
   <div><b class="mono" style="color:var(--teal);font-size:11px">LIMITAÇÕES CENTRAIS</b>
    <p style="color:var(--txt2);font-size:12.5px;margin:6px 0">Reads e percentuais são indicadores composicionais relativos. eDNA não confirma viabilidade, toxina, infectividade nem ausência real. O % COI é relativo apenas ao marcador COI.</p></div>
  </div></div>`;
})();
function distHTML(k){
 const rows=[['Alto',k.classe_alto,3],['Moderado',k.classe_moderado,2],
  ['Baixo a moderado',k.classe_baixo_mod,1],['Baixo',k.classe_baixo,0]];
 const max=Math.max(...rows.map(r=>r[1]))||1;
 return rows.map(([l,v,q])=>`<div class="distbar"><div class="lab">${l}</div>
  <div class="track"><div class="fill" style="width:${Math.max(v/max*100,4)}%;background:${QC[q]}">${v}</div></div></div>`).join('');
}

(function(){
 const s=sec('municipios');const M=D.municipios;
 s.innerHTML=`<h2 class="sec-h">Municípios & Captações/SIA</h2>
 <p class="sec-d">Visão agregada por município: maior classe de risco observada, scores, pontos prioritários e presença molecular dos principais grupos. Eixo central para priorização territorial.</p>
 <div class="filters" id="mf">
  <div class="fgrp"><label>Município</label><input type="text" id="m-q" placeholder="buscar..."></div>
  <div class="fgrp"><label>Classe máxima</label><select id="m-cls"><option value="">todas</option><option>Alto</option><option>Moderado</option><option>Baixo a moderado</option><option>Baixo</option></select></div>
  <div class="fgrp"><label>Driver operacional dominante</label><select id="m-tip"><option value="">todos</option>${uniq(M.map(m=>m.tipo_predominante)).map(t=>`<option>${esc(t)}</option>`).join('')}</select></div>
  <label class="chk"><input type="checkbox" id="m-ciano"> só com cianobactérias prioritárias</label>
  <label class="chk"><input type="checkbox" id="m-coi"> só com COI/invasores</label>
 </div>
 <div class="sortbtns" id="m-sort">
  <button data-s="risk" class="active">Maior classe/score</button>
  <button data-s="alto">Mais pontos de alto risco</button>
  <button data-s="org">Mais organismos</button>
  <button data-s="abc">Município (A–Z)</button>

 </div>

 const cols=[
  {label:'Município',k:'municipio',render:r=>`<b>${esc(r.municipio)}</b>`,val:r=>r.municipio},
  {label:'Pontos/SIA',cls:'num',val:r=>r.n_pontos,render:r=>fmt(r.n_pontos)},
  {label:'Amostras',cls:'num',val:r=>r.n_amostras,render:r=>fmt(r.n_amostras)},
  {label:'Maior risco',val:r=>ORDER[r.maior_classe],render:r=>pill(r.maior_classe)},
  {label:'Score máx',cls:'num',val:r=>r.score_max,render:r=>f3(r.score_max)},
  {label:'Score médio',cls:'num',val:r=>r.score_medio,render:r=>f3(r.score_medio)},
  {label:'Pontos Alto',cls:'num',val:r=>r.n_pontos_alto,render:r=>r.n_pontos_alto>0?`<b style="color:var(--q3)">${r.n_pontos_alto}</b>`:'0'},
  {label:'Driver operacional dominante',val:r=>r.tipo_predominante,render:r=>`<b>${esc(r.tipo_predominante)}</b>`},
  {label:'Condição integrada',val:r=>r.condicao_integrada,render:r=>`<span class="muted">${esc(r.condicao_integrada)}</span>`},
  {label:'Grupos',render:r=>tagsHTML(r)},
  {label:'Pontos prioritários',render:r=>`<span class="muted" style="font-size:11.5px">${r.pontos_prioritarios.map(esc).join('; ')}</span>`},
  {label:'Confiança',render:r=>esc(r.confianca)}
 ];
 const tstate={sort:null,dir:1}; let asCards=false; let sortMode='risk';
 function filt(){let a=M.slice();
  const q=val('m-q').toLowerCase(),c=val('m-cls'),t=val('m-tip');
  if(q)a=a.filter(m=>m.municipio.toLowerCase().includes(q));
  if(c)a=a.filter(m=>m.maior_classe===c);
  if(t)a=a.filter(m=>m.tipo_predominante===t);
  if(chk('m-ciano'))a=a.filter(m=>m.ciano);

  if(sortMode==='risk')a.sort((x,y)=>(ORDER[y.maior_classe]-ORDER[x.maior_classe])||(y.score_max-x.score_max));
  else if(sortMode==='alto')a.sort((x,y)=>(y.n_pontos_alto-x.n_pontos_alto)||(y.score_max-x.score_max));

 function tagsHTML(r){return `<div class="tags">

function heatmap(h){
 const wrap=document.createElement('div');wrap.className='heatwrap';
 const vals=h.matrix.flat().filter(v=>v!=null);const max=Math.max(...vals,1);
 const color=v=>{const t=Math.min(v/max,1);
  // teal sequential: light->deep
  const c1=[180,235,240],c2=[0,110,124];const mix=(a,b)=>Math.round(a+(b-a)*Math.pow(t,.6));
  return `rgb(${mix(c1[0],c2[0])},${mix(c1[1],c2[1])},${mix(c1[2],c2[2])})`;};
 let html='<table class="heat"><thead><tr><th class="corner rowh">Ponto/SIA \\ Táxon</th>'+
  h.taxa.map(t=>`<th class="cor"><div>${esc(t)}</div></th>`).join('')+'</tr></thead><tbody>';
 h.points.forEach((p,i)=>{
  html+=`<tr><th class="rowh"><div class="pn">${esc(p.id)}</div><div class="pm">${esc(p.municipio)} · ${esc(p.classe)} · ${f3(p.score)}</div></th>`;
  h.matrix[i].forEach(v=>{html+= v==null?'<td class="empty">·</td>':`<td style="background:${color(v)}" title="${fpc(v)}">${Math.round(v)}</td>`;});
  html+='</tr>';});
 html+='</tbody></table>';wrap.innerHTML=html;return wrap;
}

 <p class="sec-d">Bases interpretativas, limitações técnicas e referências. Tratar todos os resultados como triagem molecular relativa da Campanha 1.</p>
 <div class="panel"><h3>Princípios de interpretação</h3>
  <ul style="margin:0;padding-left:18px;color:var(--txt2);font-size:13px;line-height:1.7">
   <li>Reads não equivalem a abundância real, biomassa ou densidade celular.</li>
   <li>% reads é composicional e relativo ao conjunto sequenciado de cada amostra.</li>
   <li>% COI foi calculado retrospectivamente por amostra (reads do táxon ÷ total de reads COI da amostra × 100) e é comparável apenas entre táxons COI da mesma amostra.</li>
   <li>Metabarcoding/eDNA não confirma viabilidade, toxicidade nem infectividade.</li>
   <li>Ausência de detecção não significa ausência real do organismo.</li>
   <li>Presença molecular pode refletir DNA livre, células mortas, fragmentos, material transportado ou contaminação.</li>
   <li>Resultados dependem de primers, PCR, profundidade de sequenciamento e banco de referência.</li>
   <li>Identificações em nível taxonômico alto têm menor resolução para inferência de risco.</li>
   <li>Relações com turbidez, clima ou operação são hipóteses técnicas, não causalidade demonstrada.</li>
  </ul></div>
 <div class="panel"><h3>Regras de derivação do dashboard</h3>
  <ul style="margin:0;padding-left:18px;color:var(--txt2);font-size:13px;line-height:1.7">
   <li><b>Driver operacional dominante:</b> família de driver com maior sinal molecular relativo entre Ciano %, Bact % e COI % observados no ponto. É o campo principal de comunicação operacional (inferência derivada dos % observados).</li>
   <li><b>Condição integrada:</b> resume a coexistência de drivers no ponto/município; "Risco misto" indica mais de uma família relevante (regra literal sobre o campo "Principais drivers de risco" da planilha). Os demais drivers aparecem como "Drivers adicionais".</li>
   <li><b>Agregação municipal:</b> maior classe por ordem (Baixo &lt; Baixo a moderado &lt; Moderado &lt; Alto); score máx/médio e contagens calculados sobre as amostras do município.</li>
   <li><b>Recomendação municipal (proporcional ao sinal):</b> cianobactérias com sinal alto (% prioritárias máx ≥ ${D.thresholds.ciano_hi}% no município) acionam microscopia/contagem, clorofila-a, ficocianina, qPCR e cianotoxinas; cianobactérias com sinal baixo/moderado (&gt;0 e &lt; ${D.thresholds.ciano_hi}%) acionam reamostragem dirigida, acompanhamento temporal e cruzamento com turbidez/clima/operação, sem dosagem automática de cianotoxinas; bactérias de interesse sanitário com sinal relevante (% sanitárias máx ≥ ${D.thresholds.bact_rel}%) acionam confirmação por métodos normativos (E. coli/coliformes); COI/invasores acionam qPCR específica e inspeção de captação; baixo sinal mantém monitoramento de rotina.</li>
   <li>Os limiares (${D.thresholds.ciano_hi}% para cianobactérias; ${D.thresholds.bact_rel}% para bactérias) correspondem aproximadamente ao quartil superior dos sinais não nulos observados na Campanha 1 e são apenas critérios de comunicação; não recalculam o score nem alteram as classes.</li>
  </ul></div>
 <div class="panel"><h3>Metodologia do ranking de pontos/SIA</h3>
  <p style="font-size:13px;color:var(--txt2);line-height:1.65;margin:0 0 10px">O ranking de pontos/SIA foi elaborado como uma priorização integrada de risco por ponto de coleta, usando os dados moleculares de metabarcoding/eDNA associados aos metadados disponíveis para cada amostra. A unidade de análise foi o ponto de captação/SIA ou ponto de coleta, e não o organismo isoladamente.</p>
  <p style="font-size:13px;color:var(--txt2);line-height:1.65;margin:0 0 8px">A classificação foi baseada em um score integrado relativo, construído a partir da combinação de três blocos principais de evidência molecular:</p>
  <ol style="margin:0 0 10px;padding-left:20px;color:var(--txt2);font-size:13px;line-height:1.65">
   <li><b>Cianobactérias prioritárias:</b> número de reads, porcentagem relativa de reads atribuída a cianobactérias prioritárias e presença de táxons de maior interesse ambiental, operacional ou sanitário.</li>
   <li><b>Bactérias de interesse sanitário ou operacional:</b> número de reads, porcentagem relativa desses reads no marcador bacteriano e presença de bactérias potencialmente associadas a contaminação ambiental, biofilme, oportunismo sanitário ou degradação da qualidade da água bruta.</li>
   <li><b>COI/eucariotos de interesse ambiental ou operacional:</b> número de reads de organismos COI prioritários, presença de organismos exóticos, invasores ou operacionalmente relevantes e percentual COI calculado por amostra.</li>
  </ol>
  <p style="font-size:13px;color:var(--txt2);line-height:1.65;margin:0">O score integrado varia de 0 a 1 e deve ser interpretado como métrica interna de triagem e priorização. Valores mais altos indicam pontos com maior concentração de drivers moleculares de risco. O score não representa probabilidade absoluta de risco, risco sanitário confirmado, abundância real, biomassa, viabilidade, infectividade ou concentração de toxinas.</p></div>
